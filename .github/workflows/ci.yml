name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: salesforce/cli:latest-full

    # This tells GitHub to run all commands inside the traveltrust folder
    defaults:
      run:
        working-directory: ./traveltrust

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Environment
        run: |
          sf --version
          node --version

      - name: Validate Project Structure
        run: |
          test -f sfdx-project.json
          test -d force-app
          echo "Success: Project files found in traveltrust directory."

      - name: List Salesforce Files
        run: ls -la
name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    # Using the official image makes the workflow significantly faster
    container:
      image: salesforce/cli:latest-full

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Environment
        run: |
          sf --version
          node --version

      - name: Validate Project Structure
        run: |
          # If this fails, your files are likely in a subfolder
          test -f sfdx-project.json
          test -d force-app
          echo "Project structure is valid."

      - name: Source List (Optional Debug)
        run: sf project list column